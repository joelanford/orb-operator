name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release variables
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo IMAGE_TAG="${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo GORELEASER_ARGS="--clean" >> $GITHUB_ENV
            echo ENABLE_RELEASE_PIPELINE=true >> $GITHUB_ENV
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            echo IMAGE_TAG="main" >> $GITHUB_ENV
            echo GORELEASER_ARGS="--clean --skip=validate" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            echo IMAGE_TAG="pr-$(echo "${GITHUB_REF}" | sed -E 's|refs/pull/([^/]+)/?.*|\1|')" >> $GITHUB_ENV
            echo GORELEASER_ARGS="--snapshot --clean" >> $GITHUB_ENV
          fi
      - run: make manifest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
